<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-4">Iniciar sesión</h1>

      @if (mensajeError()) {
        <div class="alert alert-danger py-2 small" role="alert">
          {{ mensajeError() }}
        </div>
      }

      <form [formGroup]="formularioLogin" (ngSubmit)="enviarFormulario()" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input
            id="usuario"
            type="text"
            class="form-control"
            formControlName="usuario"
            placeholder="Nombre de usuario"
            autocomplete="username"
            [class.is-invalid]="campoInvalido('usuario')"
          />
          @if (campoInvalido('usuario')) {
            <div class="invalid-feedback">El nombre de usuario es obligatorio.</div>
          }
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <div class="input-group">
            <input
              id="contrasena"
              [type]="mostrarContrasena() ? 'text' : 'password'"
              class="form-control"
              formControlName="contrasena"
              placeholder="Contraseña"
              autocomplete="current-password"
              [class.is-invalid]="campoInvalido('contrasena')"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="alternarContrasena()"
            >
              {{ mostrarContrasena() ? 'Ocultar' : 'Ver' }}
            </button>
            @if (campoInvalido('contrasena')) {
              <div class="invalid-feedback">La contraseña es obligatoria.</div>
            }
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enviando()">
          @if (enviando()) {
            Ingresando...
          } @else {
            Entrar
          }
        </button>
      </form>
    </div>
  </div>
</div>
